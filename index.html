<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ferramenta de diagnóstico empresarial da Berry Consultoria.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='170 150 460 490'%3E%3Cg fill='none' stroke-width='54'%3E%3Ccircle cx='290' cy='272' r='86' stroke='%230D30A4'/%3E%3Ccircle cx='290' cy='524' r='86' stroke='%230D30A4'/%3E%3Ccircle cx='508' cy='398' r='86' stroke='%2347C97E'/%3E%3C/g%3E%3C/svg%3E">
</head>
<body>
<title>Diagnóstico Berry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  color-scheme:dark;
  /* Berry — neutros (90–95%) */
  --black:#05060C; --gray-light:#F0F0F0; --gray:#7A7A7A;
  /* Berry — destaques (5–10%) */
  --blue:#0D30A4; --blue-hover:#1238C4; --accent-ink:#8FA3F2;
  --green:#47C97E; --green-ink:#47C97E;
  --ink:#F0F0F0; --muted:#A3A3A3; --faint:#7A7A7A;
  --bg:#05060C; --surface:#101116; --surface-2:#16171D;
  --line:#23252C; --line-strong:#34363F;
  --tint-blue:#0E1638; --tint-green:#0E2618;
  --bad:#E8715F; --bad-tint:#2A1411;
  --warn:#E3A63B; --warn-tint:#2A200D;
  --good:#47C97E; --good-tint:#0E2618;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --display:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--bg);background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:56px 56px;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;font-family:var(--display);font-weight:500}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(5,6,12,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font-family:var(--display);font-weight:500;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.top-meta{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
.status.ex i{background:var(--warn)}
.status.err i{background:var(--bad)}
.status.err{color:var(--bad)}
.live{font-family:var(--mono);font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink);white-space:nowrap}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--gray)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}

.banner{background:var(--warn-tint);color:var(--ink);border-bottom:1px solid var(--line)}
.banner-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}

/* ---------- layout ---------- */
.shell{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:28px 60px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:36px}
.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);align-self:start;display:flex;flex-direction:column;gap:2px}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:10px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.step:hover{background:var(--surface)}
.step .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;font-family:var(--mono);font-size:12px;flex:none;color:var(--muted)}
.step .t{font-family:var(--display);font-weight:500;font-size:14px;line-height:1.3}
.step .s{font-size:12px;color:var(--muted);font-family:var(--mono)}
.step.on{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-strong)}
.step.on .n{background:var(--ink);border-color:var(--ink);color:var(--black)}
.step.done .n{background:var(--tint-green);border-color:var(--green);color:var(--green-ink)}
main{min-width:0}
.head{margin-bottom:22px}
.eyebrow{font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.head h1{font-size:30px;letter-spacing:-.015em;margin-top:6px}
.head p{color:var(--muted);margin:6px 0 0;max-width:62ch}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label,.lbl{font-size:13px;font-weight:600}
.field small{color:var(--muted);font-size:12px}
.inp{width:100%;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:15px}
.inp:focus{border-color:var(--accent-ink);outline:none;box-shadow:0 0 0 3px var(--tint-blue)}
textarea.inp{min-height:84px;resize:vertical;line-height:1.45}
.money{font-family:var(--mono);font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-strong);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;background:var(--surface-2);user-select:none}
.tipos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tipo{display:flex;flex-direction:column;gap:2px;text-align:left;border:1.5px solid var(--line-strong);border-radius:10px;padding:10px 12px;background:var(--surface-2);cursor:pointer}
.tipo b{font-size:14px;font-family:var(--display);font-weight:500}
.tipo span{font-size:12px;color:var(--muted);line-height:1.35}
.tipo[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.tipo[aria-pressed="true"] b::before{content:"● ";color:var(--green)}
@media (max-width:860px){.tipos{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--black);font-weight:500}
.seg{display:flex;flex-wrap:wrap;gap:8px}

.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}

/* ---------- numbers / urgency ---------- */
.nums{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.gapcard{background:linear-gradient(180deg,#0B0E1E,#08090F);border:1px solid var(--line-strong);border-top:3px solid var(--blue);color:var(--ink);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px}
.gapcard .eyebrow{color:var(--muted)}
.gapbig{font-family:var(--display);font-size:40px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.gapline{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:10px;font-size:14px;color:var(--muted)}
.gapline b{font-family:var(--display);font-weight:500;white-space:nowrap;color:var(--ink)}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.gapcard .muted{color:var(--muted);font-size:13px}
.gapcard .muted b{color:#fff}
.calc{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.calc div{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.calc b{color:var(--ink)}
.calc b{font-family:var(--mono);white-space:nowrap}
.calc .eq{border-top:1px solid var(--line-strong);padding-top:6px;font-weight:600;color:var(--ink)}
.lk-head{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 0 6px;border-top:0}
.lk-head div:nth-child(n+2){text-align:right}
.leaks-h{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.leaks{display:flex;flex-direction:column}
.leak{display:grid;grid-template-columns:minmax(0,1fr) 92px 110px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.leak.total{border-top:2px solid var(--ink);font-size:16px}
.lk-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.lk-t span{font-size:13px;color:var(--muted)}
.lk-t .lk-src{font-family:var(--mono);font-size:11px;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.b{background:var(--bad)}.dot.i{background:var(--warn)}
.lk-p{display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.lk-p .inp{width:72px;text-align:right;padding:6px 8px;font-size:14px}
.lk-p small{font-size:11px;color:var(--muted);white-space:nowrap}
.lk-p .linkbtn{font-size:11px}
.lk-v{text-align:right;font-weight:500;font-family:var(--display);white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:620px){.leak{grid-template-columns:minmax(0,1fr) 80px;}.lk-v{grid-column:1/-1;text-align:left}}

/* ---------- questions ---------- */
.qtools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.prog{flex:1;min-width:180px;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.prog .track{flex:1;height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--green)}
.pillar-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
.pillar-h:first-of-type{margin-top:4px}
.pillar-h h2{font-size:18px;display:flex;align-items:center;gap:10px}
.pillar-h h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px rgba(13,48,164,.25)}
.pillar-h span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;margin-bottom:12px}
.q.answered{border-color:var(--line-strong)}
.qtop{display:flex;gap:12px;align-items:flex-start}
.qid{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:3px;flex:none;width:28px}
.qbody{flex:1;min-width:0}
.qtitle{font-family:var(--display);font-weight:500;font-size:16.5px;line-height:1.35}
.weight{display:inline-flex;gap:3px;vertical-align:middle;margin-left:8px}
.weight i{width:6px;height:6px;border-radius:50%;background:var(--line-strong)}
.weight i.on{background:var(--ink)}
.dig{margin-top:8px;font-size:14px;color:var(--muted);display:flex;gap:8px}
.dig b{color:var(--green);font-weight:500;font-family:var(--display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding-top:2px;flex:none}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.lv{position:relative}
.lv input{position:absolute;opacity:0;pointer-events:none}
.lv label{display:flex;flex-direction:column;gap:4px;height:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--surface-2);font-size:13px;color:var(--muted);line-height:1.4}
.lv label b{font-size:13px;color:var(--ink);display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:500}
.lv label b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.lv input:focus-visible+label{outline:2px solid var(--green);outline-offset:2px}
.lv input:checked+label{border-color:var(--c);background:var(--ct);color:var(--ink)}
.lv.b{--c:var(--bad);--ct:var(--bad-tint)}
.lv.i{--c:var(--warn);--ct:var(--warn-tint)}
.lv.a{--c:var(--good);--ct:var(--good-tint)}
.qfoot{display:flex;gap:14px;align-items:center;margin-top:10px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}
.linkbtn.on{color:var(--accent-ink);font-weight:600;text-decoration:none}
.note{margin-top:10px}

/* ---------- pain ---------- */
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface-2);cursor:pointer;font-family:var(--mono);font-weight:600}
.scale button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--black)}
.hint{font-size:13px;color:var(--muted);margin-top:2px}
.auto-parecer{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.6}
.divider{grid-column:1/-1;border-top:1px dashed var(--line-strong);margin:6px 0}

/* ---------- result ---------- */
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.toast{font-size:13px;color:var(--green-ink);font-family:var(--mono);flex-basis:100%}
.toast.warn{color:var(--warn)}
.plano-b{background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;padding:16px;margin-bottom:18px}
.pb-h{font-size:14px;line-height:1.55;color:var(--muted);margin-bottom:12px}
.pb-h b{color:var(--ink)}
.pb-motivo{color:var(--warn);margin-bottom:8px}
.pb-motivo b{color:var(--warn)}
.pb-btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.plano-b img{display:block;width:100%;max-width:820px;margin:0 auto;border-radius:6px;background:#fff}
.docwrap{overflow-x:auto;border-radius:6px;box-shadow:var(--shadow)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.15);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-h{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer-h h2{font-size:18px}
.drawer-b{overflow-y:auto;padding:12px 16px 24px;display:flex;flex-direction:column;gap:8px}
.hitem{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.hitem.cur{border-color:var(--ink)}
.hitem .grow{flex:1;min-width:0}
.hitem .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hitem .mt{font-size:12px;color:var(--muted);font-family:var(--mono)}
.hscore{font-family:var(--mono);font-weight:600;font-size:18px;text-align:right;line-height:1.1}
.hscore small{display:block;font-size:10px;letter-spacing:.06em;font-weight:500}
.hbtns{display:flex;gap:6px;margin-top:8px}
.hbtns .btn{padding:5px 10px;font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:20px 4px}

/* ============ REPORT DOCUMENT (always light, it is paper) ============ */
.doc{--d-blue:#0D30A4;--d-green:#47C97E;--d-ink:#05060C;--d-muted:#6E6E6E;--d-line:#E6E6E6;--d-soft:#F0F0F0;--d-gray:#7A7A7A;
  --d-bad:#C9402F;--d-warn:#B97800;--d-good:#23894F;
  background:#fff;color:var(--d-ink);font-family:var(--sans);font-size:13px;line-height:1.55;width:100%;max-width:820px;min-width:640px;margin:0 auto;padding:36px 40px 40px;color-scheme:light;font-variant-numeric:normal;font-feature-settings:"calt" 0,"liga" 0,"tnum" 0;font-variant-ligatures:none}
.doc *{font-variant-numeric:normal}
.doc h1,.doc h2,.doc .v,.doc .big,.doc .pt,.doc .nm{font-family:var(--display);font-weight:500}
.doc h2{font-size:16px;letter-spacing:-.005em;margin:0 0 12px;display:flex;align-items:center;gap:10px;color:var(--d-ink)}
.doc h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--d-blue);flex:none}
.doc section{margin-top:30px}
.d-cover{background-color:#05060C;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:32px 32px;color:#F0F0F0;border-radius:12px;padding:26px 30px;display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.d-cover .logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:500;font-size:18px;color:#F0F0F0}
.d-cover .logo svg{width:32px;height:32px}
.d-cover .kicker{font-family:var(--display);font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9A9A9A;margin-top:26px}
.d-cover h1{font-size:30px;letter-spacing:-.015em;margin-top:4px;color:#FFFFFF}
.d-cover .sub{color:#A3A3A3;margin-top:4px}
.d-meta{text-align:right;font-size:12px;color:#A3A3A3;line-height:1.8}
.d-meta b{color:#F0F0F0;font-weight:500}
.d-kpis{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:12px}
.d-kpi{border:1px solid var(--d-line);border-radius:10px;padding:14px 16px}
.d-kpi .k{font-family:var(--display);font-weight:500;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--d-muted)}
.d-kpi .v{font-size:26px;letter-spacing:-.02em;line-height:1.2;margin-top:4px}
.d-kpi .x{font-size:12px;color:var(--d-muted)}
.d-kpi.hero{display:flex;gap:14px;align-items:center;background:var(--d-soft);border-color:transparent}
.pill{display:inline-block;font-family:var(--display);font-size:10px;font-weight:500;letter-spacing:.1em;padding:3px 8px;border-radius:99px;text-transform:uppercase}
.pill.b{background:#FCEDEA;color:var(--d-bad)}.pill.i{background:#FDF4E1;color:var(--d-warn)}.pill.a{background:#E8F6EE;color:var(--d-good)}
.pill.n{background:var(--d-soft);color:var(--d-ink)}
.d-gap{background-color:#05060C;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:32px 32px;color:#F0F0F0;border-radius:12px;border-top:3px solid var(--d-blue);padding:20px 22px;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center}
.d-gap .big{font-size:32px;letter-spacing:-.02em;line-height:1.1;margin-top:6px;color:#fff}
.d-gap .lab{font-size:12px;color:#A3A3A3}
.d-gap .rows{display:flex;flex-direction:column;gap:8px}
.d-gap .row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:#BDBDBD;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:6px}
.d-gap .row:last-child{border:0;padding:0}

/* ---------- cálculos ---------- */
function scoreOf(qs,resp){
  let pts=0,max=0;
  for(const q of qs){const r=resp[q.id]; if(!r||!r.n||r.n==="na")continue; pts+=NIVEL[r.n].p*q.peso; max+=3*q.peso;}
  return max?pts/max:null;
}
function calc(s){
  const QS=qsDe(s);
  const geral=scoreOf(QS,s.respostas);
  const nota=geral==null?null:geral*10;
  const pilares=PILARES.map(p=>({key:p,p:PL(s,p),v:scoreOf(QS.filter(q=>q.pilar===p),s.respostas)}));
  const aval=pilares.filter(x=>x.v!=null);
  const melhor=aval.length?aval.reduce((a,b)=>b.v>a.v?b:a):null;
  const pior=aval.length?aval.reduce((a,b)=>b.v<a.v?b:a):null;
  const crit=[];
  for(const q of QS){const r=s.respostas[q.id]; if(!r||(r.n!=="b"&&r.n!=="i"))continue;
    let tipo; if(q.peso===3&&r.n==="b")tipo="Prioridade"; else if(q.peso===3&&r.n==="i")tipo="Oportunidade"; else tipo="Atenção";
    crit.push({q,n:r.n,tipo,rank:(tipo==="Prioridade"?0:tipo==="Oportunidade"?1:2)*10+(r.n==="b"?0:1)});}
  crit.sort((a,b)=>a.rank-b.rank);
  const n=s.numeros, fat=n.fat;
  /* 1) Tetos: quanto cada problema identificado pode estar custando, em % do faturamento */
  const vaz=[];
  for(const v of vazDe(s)){
    const r=s.respostas[v.q]; if(!r||(r.n!=="b"&&r.n!=="i"))continue;
    let p, fixo=false;
    if(v.money&&n.juros!=null&&fat){p=n.juros/fat*100; fixo=true;}
    else p=(s.vaz&&s.vaz[v.k]!=null)?s.vaz[v.k]:v[r.n];
    vaz.push({...v,n:r.n,p,fixo,padrao:v[r.n],teto:fat?fat*p/100:null,valor:null});
  }
  vaz.sort((a,b)=>b.p-a.p);
  const tetoTotal=fat?vaz.reduce((a,x)=>a+x.teto,0):null;
  /* 2) Lucro atual × lucro de referência do segmento */
  const lucro=n.resTipo==="lucro"&&n.resultado!=null?n.resultado:n.resTipo==="prejuizo"&&n.resultado!=null?-n.resultado:null;
  const refPct=n.margemRef!=null?n.margemRef:MARGEM_REF[tipoDe(s)];
  const lucroRef=fat?fat*refPct/100:null;
  let modo=null, perda=null, outros=0, extra=null;
  if(fat&&lucro==null){ /* não sabe o lucro: estimativa pelos problemas do diagnóstico */
    modo="estimativa"; perda=tetoTotal; vaz.forEach(v=>v.valor=v.teto);
  }else if(fat){
    const gap=lucroRef-lucro;
    if(gap<=0){ modo="saudavel"; perda=0; extra=tetoTotal; vaz.forEach(v=>v.valor=0); }
    else{
      /* 3) Distribui a diferença: valores informados primeiro, estimados em proporção ao teto; o que passar dos tetos vai para "outros" */
      modo="margem"; perda=gap; let rest=gap;
      vaz.filter(v=>v.fixo).forEach(v=>{v.valor=Math.min(v.teto,rest); rest-=v.valor;});
      const est=vaz.filter(v=>!v.fixo), E=est.reduce((a,v)=>a+v.teto,0);
      if(rest>=E){ est.forEach(v=>v.valor=v.teto); outros=rest-E; }
      else est.forEach(v=>v.valor=E?v.teto*rest/E:0);
    }
  }
  const margem=(lucro!=null&&fat)?lucro/fat:null;
  const lucroPot=(lucro!=null&&perda!=null)?lucro+perda:null;
  const respondidas=QS.filter(q=>s.respostas[q.id]&&s.respostas[q.id].n).length;
  return {nota,mat:maturidade(nota),pilares,melhor,pior,crit,
    prior:crit.filter(c=>c.tipo==="Prioridade").length,oport:crit.filter(c=>c.tipo==="Oportunidade").length,
    vaz,modo,perda,outros,extra,tetoTotal,refPct,lucroRef,
    perdaAno:perda!=null?perda*12:null,acum:(perda!=null&&n.tempo)?perda*n.tempo:null,
    lucro,margem,lucroPot,margemPot:(lucroPot!=null&&fat)?lucroPot/fat:null,
    porReal:(lucro>0&&perda)?perda/lucro:null,
    potencial:nota?(10-nota)/nota:null,respondidas};
}
function maturidade(n){if(n==null)return null; if(n<5)return {k:"b",t:"Básico"}; if(n<8)return {k:"i",t:"Intermediário"}; return {k:"a",t:"Avançado"};}
function lvlKey(v){return v==null?null:v<.5?"b":v<.8?"i":"a";}

const pct=v=>v==null?"—":(v*100).toLocaleString("pt-BR",{maximumFractionDigits:0})+"%";
const dec=v=>v==null?"—":v.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1});
const pct1=v=>v==null?"—":(v*100).toLocaleString("pt-BR",{maximumFractionDigits:1})+"%";
const numBR=v=>v==null?"":v.toLocaleString("pt-BR",{maximumFractionDigits:2});
const parseNum=s=>{let t=String(s).trim(); if(t.includes(","))t=t.replace(/\./g,"").replace(",","."); t=t.replace(/[^\d.]/g,""); return t===""||isNaN(+t)?null:+t;};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const parseMoney=s=>{const d=String(s).replace(/\D/g,""); return d?parseInt(d,10):null;};

/* ---------- armazenamento (localStorage localmente; banco compartilhado quando publicado) ---------- */
const LS_KEY="berry-diagnosticos-v1", LS_CUR="berry-diagnostico-atual";
const localStore={
  kind:"local",
  _all(){try{return JSON.parse(localStorage.getItem(LS_KEY)||"{}")}catch(e){return {}}},
  async list(){return Object.values(this._all())},
  ok:true,
  async save(s){try{const a=this._all(); a[s.id]=s; localStorage.setItem(LS_KEY,JSON.stringify(a)); this.ok=true;}catch(e){this.ok=false;}},
  async remove(id){try{const a=this._all(); delete a[id]; localStorage.setItem(LS_KEY,JSON.stringify(a))}catch(e){}}
};
function dbStore(db){
  let chain=Promise.resolve();
  return {kind:"db",
    async list(){const snap=await db.collection("diagnosticos").get(); return snap.docs.map(d=>d.data()).filter(Boolean);},
    save(s){const copy=JSON.parse(JSON.stringify(s)); const p=chain.then(()=>db.doc("diagnosticos/"+s.id).set(copy)); chain=p.catch(()=>{}); return p;},
    async remove(id){await db.doc("diagnosticos/"+id).delete();}};
}
let store=localStore;
const inArtifact=()=>!!(window.claude&&typeof window.claude.use==="function");
const useCap=(name,ms=6000)=>inArtifact()?Promise.race([window.claude.use(name).catch(()=>null),new Promise(r=>setTimeout(()=>r(null),ms))]):Promise.resolve(null);

let S=exemplo(), step=0, saveTimer=null, openNotes=new Set();
function setCurrent(id){try{localStorage.setItem(LS_CUR,id)}catch(e){}}
/* Onde o diagnóstico ficou salvo: "time" (histórico compartilhado), "local" (só este navegador) ou "erro". */
let ondeSalvo=null;
async function salvarAgora(){
  const snap=S;
  if(store.kind==="db"){
    try{await store.save(snap); ondeSalvo="time"; await localStore.remove(snap.id); setStatus(); return;}
    catch(e){ /* sem permissão de gravar no histórico do time (ou falha momentânea): guarda no navegador */ }
  }
  await localStore.save(snap);
  ondeSalvo=localStore.ok?"local":"erro"; setStatus();
}
function touch(){
  if(S.exemplo){ /* editou o exemplo: vira um diagnóstico real, para não perder o que foi preenchido */
    const id=blank().id; S.exemplo=false; S.id=id; S.criadoEm=new Date().toISOString(); setCurrent(id);
  }
  S.atualizadoEm=new Date().toISOString();
  setStatus("Salvando…");
  clearTimeout(saveTimer);
  saveTimer=setTimeout(salvarAgora,600);
  updateChrome();
}
function setStatus(t){
  const el=document.getElementById("save-status");
  const txt=S.exemplo?"Exemplo — não salvo":t?t:ondeSalvo==="time"?"Salvo no histórico do time":ondeSalvo==="local"?"Salvo só neste navegador":ondeSalvo==="erro"?"Não foi possível salvar":"Salvo";
  const site=!inArtifact(); /* no site, salvar no navegador é o normal (não é aviso) */
  if(site&&!t&&ondeSalvo==="local"&&!S.exemplo){el.classList.remove("ex","err"); el.title="Os diagnósticos ficam salvos neste navegador, neste computador."; el.querySelector("span").textContent="Salvo neste computador"; return;}
  el.classList.toggle("ex",S.exemplo||ondeSalvo==="local"); el.classList.toggle("err",ondeSalvo==="erro"&&!S.exemplo);
  el.title=ondeSalvo==="local"?"Sua conta não tem permissão para gravar no histórico do time (ou você não está logado no Claude). O diagnóstico fica salvo neste navegador.":ondeSalvo==="erro"?"O navegador bloqueou o armazenamento. Baixe o PDF antes de fechar.":"";
  el.querySelector("span").textContent=txt;
}
function updateChrome(){
  const c=calc(S);
  document.getElementById("live-score").textContent=c.nota==null?"Nota —":`Nota ${dec(c.nota)} · ${c.respondidas}/${PERGUNTAS.length}`;
  document.getElementById("top-company").textContent=S.empresa.nome?"· "+S.empresa.nome:"";
  document.getElementById("example-banner").hidden=!S.exemplo;
  renderSteps(c);
}
function getPath(o,p){return p.split(".").reduce((a,k)=>a?.[k],o)}
function setPath(o,p,v){const ks=p.split("."); let t=o; ks.slice(0,-1).forEach(k=>t=t[k]); t[ks.at(-1)]=v;}

/* ---------- render: etapas ---------- */
function stepDone(i,c){
  if(i===0)return !!S.empresa.nome;
  if(i===1)return c.respondidas===PERGUNTAS.length;
  if(i===2)return S.numeros.fat!=null&&!!S.numeros.resTipo;
  if(i===3)return S.dor.prioridade!=null;
  return false;
}
function renderSteps(c=calc(S)){
  document.getElementById("steps").innerHTML=STEPS.map((st,i)=>{
    const sub=i===1?`${c.respondidas} de ${PERGUNTAS.length} respondidas`:st.s;
    return `<button class="step ${i===step?"on":""} ${i!==step&&stepDone(i,c)?"done":""}" type="button" data-go="${i}" ${i===step?'aria-current="step"':""}>
      <span class="n">${i!==step&&stepDone(i,c)?"✓":i+1}</span><span><span class="t">${st.t}</span><br><span class="s">${sub}</span></span></button>`}).join("");
}
function navRow(){
  const prev=step>0?`<button class="btn" type="button" data-go="${step-1}">← ${STEPS[step-1].t}</button>`:"<span></span>";
  const next=step<STEPS.length-1?`<button class="btn primary" type="button" data-go="${step+1}">${step===3?"Gerar resultado":"Próximo: "+STEPS[step+1].t} →</button>`:"";
  return `<div class="navrow">${prev}${next}</div>`;
}
function render(){
  const m=document.getElementById("main");
  m.innerHTML=[renderEmpresa,renderDiag,renderPerdas,renderDor,renderResultado][step]();
  updateChrome(); setStatus();
}

    <input class="inp" id="${id}" data-bind="${path}" value="${esc(v)}" placeholder="${esc(opt.ph||"")}" ${opt.type?`type="${opt.type}"`:""} autocomplete="off">
    ${opt.help?`<small>${opt.help}</small>`:""}</div>`;
}

const reais=v=>v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
function gapCardHTML(){
  const c=calc(S), n=S.numeros, seg=SEGMENTOS[tipoDe(S)].t;
  if(!n.fat) return `<div class="gapcard"><div class="eyebrow">Resultado deixado na mesa</div>
    <div class="muted">Preencha o faturamento mensal para calcular quanto a empresa está deixando na mesa.</div></div>`;
  const tempoTxt=n.tempo?TEMPOS.find(t=>t.v===n.tempo)?.t.toLowerCase():null;
  const tempoLinhas=`<div class="gapline"><span>Em 12 meses</span><b>${brl(c.perdaAno)}</b></div>
    ${c.acum!=null?`<div class="gapline"><span>Já perdido (${tempoTxt})</span><b>${brl(c.acum)}</b></div>`:""}`;
  if(c.modo==="saudavel") return `<div class="gapcard"><div class="eyebrow">Margem dentro da referência</div>
    <div class="gapbig">${pct1(c.margem)}</div>
    <div class="muted">Sobram ${brl(c.lucro)} por mês — acima da referência de ${numBR(c.refPct)}% para ${seg}. ${c.extra?`Os problemas do diagnóstico ainda indicam até <b>${brl(c.extra)}/mês</b> de potencial adicional.`:""}</div></div>`;
  if(c.modo==="estimativa") return `<div class="gapcard"><div class="eyebrow">Estimativa de perda mensal</div>
    <div class="gapbig">${brl(c.perda)}</div>
    <div class="muted">O cliente não sabe quanto sobra. Estimativa pelos problemas identificados no diagnóstico: ${pct1(c.perda/n.fat)} do faturamento.</div>
    ${tempoLinhas}
    <div class="gapline"><span>Quanto sobraria em ${SEGMENTOS[tipoDe(S)].bem} (${numBR(c.refPct)}%)</span><b>${brl(c.lucroRef)}</b></div></div>`;
  return `<div class="gapcard"><div class="eyebrow">Deixando na mesa todo mês</div>
    <div class="gapbig">${brl(c.perda)}</div>
    ${c.porReal!=null?`<div class="muted">Para cada <b>R$ 1</b> que sobra hoje, <b>R$ ${reais(c.porReal)}</b> ficam na mesa.</div>`:""}

/* ---------- parecer automático (montado a partir das respostas) ---------- */
const lowerFirst=t=>t?t.charAt(0).toLowerCase()+t.slice(1):t;
const lista=a=>a.length<2?(a[0]||""):a.slice(0,-1).join(", ")+" e "+a[a.length-1];
function autoParecer(s){
  if(s.parecer.texto) return s.parecer.texto; /* diagnósticos antigos com parecer escrito */
  const c=calc(s), e=s.empresa, nome=e.nome||"A empresa", P=[];
  if(c.nota!=null) P.push(`${nome} está no nível ${c.mat.t.toLowerCase()} de maturidade de gestão, com nota ${dec(c.nota)} de 10.`+
    (c.melhor&&c.pior&&c.melhor.p!==c.pior.p?` O pilar mais forte é ${c.melhor.p} (${pct(c.melhor.v)}) e o maior potencial de melhoria está em ${c.pior.p} (${pct(c.pior.v)}).`:""));
  if(c.modo==="margem") P.push(`Hoje ${c.lucro<0?`a operação dá prejuízo de ${brl(-c.lucro)} por mês`:`sobram ${brl(c.lucro)} por mês (${pct1(c.margem)} do faturamento)`}, enquanto ${SEGMENTOS[tipoDe(s)].bem} deixaria ${brl(c.lucroRef)} (${numBR(c.refPct)}%). São ${brl(c.perda)} deixados na mesa todo mês — ${brl(c.perdaAno)} em 12 meses.`);
  else if(c.modo==="estimativa"&&c.perda) P.push(`A empresa não mede quanto sobra no fim do mês. Pelos problemas identificados no diagnóstico, estimamos ${brl(c.perda)} de resultado perdido por mês — ${brl(c.perdaAno)} em 12 meses.`);
  else if(c.modo==="saudavel") P.push(`A margem atual (${pct1(c.margem)}) já está dentro da referência do segmento; os pontos do diagnóstico indicam até ${brl(c.extra)} por mês de resultado adicional.`);
  const val=v=>c.modo==="saudavel"?v.teto:v.valor;
  const top=[...c.vaz].filter(v=>val(v)>0).sort((a,b)=>val(b)-val(a)).slice(0,3);
  if(top.length) P.push(`Os maiores vazamentos estão em: ${lista(top.map(v=>lowerFirst(v.t)))}.`);
  const pr=c.crit.filter(x=>x.tipo==="Prioridade").slice(0,3);
  if(pr.length) P.push(`As prioridades de ação são: ${lista(pr.map(x=>lowerFirst(x.q.ponto)))}.`);
  const preoc=dorItens(s.dor.preocupa).join("; ").trim();
  if(preoc) P.push(`${e.decisor?`Nas palavras de ${e.decisor}`:"Nas palavras do empresário"}, o que mais preocupa hoje: “${preoc.replace(/[.\s]+$/,"")}”${s.dor.prioridade!=null?` — prioridade ${s.dor.prioridade} de 10 para resolver agora`:""}.`);
  P.push("O próximo passo é transformar esses pontos em um plano de ação com metas, responsáveis e prazos.");
  return P.join("\n\n");
}
const proximoTxt=s=>s.parecer.acao?s.parecer.acao+(s.parecer.prazo?" — "+lowerFirst(s.parecer.prazo):""):(s.parecer.proximo||"");
const dorItens=v=>Array.isArray(v)?v:(v?[v]:[]);

/* ---------- gauges ---------- */
function arc(cx,cy,r,a0,a1){const p=a=>[cx+r*Math.cos(a*Math.PI/180),cy-r*Math.sin(a*Math.PI/180)];const [x0,y0]=p(a0),[x1,y1]=p(a1);return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;}
const COL={b:"#C9402F",i:"#B97800",a:"#23894F"};
/* Para o PDF: a biblioteca não desenha SVG de forma confiável, então os gráficos viram imagem (canvas → PNG). */
let RASTER=false;
function gaugePNG(v,label,big){
  const k=3,cv=document.createElement("canvas"); cv.width=160*k; cv.height=96*k;
  const x=cv.getContext("2d"); x.scale(k,k);
  const cx=80,cy=84,r=64,sw=big?16:13;
  x.lineCap="round"; x.lineWidth=sw;
  x.strokeStyle="#E6E6E6"; x.beginPath(); x.arc(cx,cy,r,Math.PI,2*Math.PI); x.stroke();
  if(v){x.strokeStyle=COL[lvlKey(v)]; x.beginPath(); x.arc(cx,cy,r,Math.PI,Math.PI+Math.PI*Math.max(.001,Math.min(1,v))); x.stroke();}
  x.fillStyle="#05060C"; x.textAlign="center"; x.font=`500 ${big?27:21}px "IBM Plex Sans", system-ui, sans-serif`;
  x.fillText(v==null?"—":big?dec(v*10):pct(v),cx,cy-6);
  if(big){x.fillStyle="#6E6E6E"; x.font='9px Inter, system-ui, sans-serif'; x.fillText("de 10",cx,cy+10);}
  return `<img src="${cv.toDataURL("image/png")}" alt="${esc(label)}" style="width:100%;max-width:150px;height:auto;display:block;margin:0 auto">`;
}
function logoPNG(){
  const cv=document.createElement("canvas"); cv.width=460; cv.height=490;
  const x=cv.getContext("2d"); x.lineWidth=54;
  [[120,122,"#0D30A4"],[120,374,"#0D30A4"],[338,248,"#47C97E"]].forEach(([cx,cy,c])=>{x.strokeStyle=c; x.beginPath(); x.arc(cx,cy,86,0,2*Math.PI); x.stroke();});
  return `<img src="${cv.toDataURL("image/png")}" alt="" style="width:34px;height:auto">`;
}
function gauge(v,label,big){
  if(RASTER) return gaugePNG(v,label,big);
  const w=160,h=96,cx=80,cy=84,r=64,sw=big?16:13;
  const k=lvlKey(v);
  const val=v==null?"—":big?dec(v*10):pct(v);
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}: ${val}">
    <path d="${arc(cx,cy,r,180,0)}" fill="none" stroke="#E6E6E6" stroke-width="${sw}" stroke-linecap="round"/>
    ${v?`<path d="${arc(cx,cy,r,180,180-180*Math.max(.001,Math.min(1,v)))}" fill="none" stroke="${COL[k]}" stroke-width="${sw}" stroke-linecap="round"/>`:""}
    <text x="${cx}" y="${cy-6}" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="500" font-size="${big?27:21}" fill="#05060C">${val}</text>
    ${big?`<text x="${cx}" y="${cy+10}" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#6E6E6E">de 10</text>`:""}
  </svg>`;
}

/* Tabela em divs: cada linha é um bloco que não é cortado entre páginas; o cabeçalho viaja junto com a 1ª linha (e com o título, se houver). */
function dTable(cols,head,rows,lead=""){
  const th=`<div class="d-tr d-th" style="grid-template-columns:${cols}">${head.map(h=>`<div>${h}</div>`).join("")}</div>`;
  const tr=r=>`<div class="d-tr${r.cls?" "+r.cls:""}" style="grid-template-columns:${cols}">${r.cells.map(c=>`<div>${c}</div>`).join("")}</div>`;
  if(!rows.length) return `<div class="avoid">${lead}${th}</div>`;
  return `<div class="avoid">${lead}${th}${tr(rows[0])}</div>${rows.slice(1).map(r=>`<div class="avoid">${tr(r)}</div>`).join("")}`;
}

      <div class="rows">

/* ---------- ações do documento ---------- */
function toast(t,fixo){const el=document.getElementById("toast"); if(!el)return; el.textContent=t; el.classList.toggle("warn",!!fixo); clearTimeout(el._t); if(t&&!fixo) el._t=setTimeout(()=>el.textContent="",6000);}
function fileBase(){return ("Diagnostico Berry - "+(S.empresa.nome||"empresa")).replace(/[\\/:*?"<>|]/g,"").trim();}
/* Gera o documento como canvas (uma imagem longa) — base tanto do PDF quanto da versão em imagem. */
function montarPalco(){
  const stage=document.getElementById("pdf-stage"); RASTER=true; try{stage.innerHTML=reportHTML(S);}finally{RASTER=false;}
  return stage;
}
const PDF_OPT=()=>({margin:[8,0,10,0],filename:fileBase()+".pdf",image:{type:"jpeg",quality:.95},
  html2canvas:{scale:2,backgroundColor:"#ffffff",useCORS:true,letterRendering:true,scrollX:0,scrollY:0},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},
  pagebreak:{mode:["css","legacy"],avoid:[".avoid"]}});
const comTempo=(p,ms,msg)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r({code:"timeout",message:msg}),ms))]);
const ERRO_DL={declined:"Download cancelado.",rate_limited:"Já há um download aguardando confirmação — confirme ou feche a janela anterior.",
  extension_not_enabled:"Esta visualização não permite baixar PDF.",rejected_extension:"Esta visualização não permite baixar PDF.",
  unavailable:"Download indisponível nesta visualização.",not_granted:"Download não autorizado nesta visualização.",too_large:"Arquivo grande demais."};
async function salvarArquivo(nome,blob){
  if(!inArtifact()){const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nome; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},4000); return "saved";}
  const dl=await useCap("downloads");
  if(!dl) throw {code:"unavailable"};
  await dl.save({filename:nome,data:blob});
  return "saved";
}
async function gerarPNG(){
  const stage=montarPalco();
  try{
    const cv=await comTempo(html2pdf().set(PDF_OPT()).from(stage.firstElementChild).toCanvas().get("canvas"),45000,"tempo esgotado ao gerar a imagem");
    return await new Promise((ok,no)=>cv.toBlob(b=>b?ok(b):no({code:"png"}),"image/png"));
  }finally{stage.innerHTML="";}
}
/* Plano B que não depende do recurso de download do Claude: o documento aparece na tela como imagem,
   e a pessoa salva com o botão direito ("Salvar imagem como…") ou copia. */
async function mostrarImagem(motivo){
  const box=document.getElementById("plano-b"); if(!box)return;
  box.hidden=false; box.innerHTML=`<div class="pb-h"><b>Gerando o documento como imagem…</b></div>`;
  const sx=window.scrollX, sy=window.scrollY; window.scrollTo(0,0);
  try{
    const blob=await gerarPNG(); window.scrollTo(sx,sy);
    const url=URL.createObjectURL(blob);
    box.innerHTML=`<div class="pb-h">${motivo?`<div class="pb-motivo">${motivo}</div>`:""}
      <b>Para salvar:</b> clique com o botão direito na imagem e escolha <b>“Salvar imagem como…”</b> (no Mac: Control + clique), ou arraste a imagem para a área de trabalho. Também dá para copiar e colar direto no WhatsApp.
      <div class="pb-btns"><button class="btn" type="button" id="btn-copy-img">Copiar imagem</button><button class="btn ghost" type="button" id="btn-fechar-pb">Fechar</button></div></div>
      <img id="pb-img" src="${url}" alt="Documento de diagnóstico de ${esc(S.empresa.nome||"empresa")}">`;
    box._blob=blob; box.scrollIntoView({behavior:"smooth",block:"start"});
  }catch(e){window.scrollTo(sx,sy); box.innerHTML=`<div class="pb-h"><div class="pb-motivo">Não foi possível gerar a imagem: ${esc((e&&(e.message||e.code))||"erro desconhecido")}.</div></div>`;}

async function copiarImagem(){
  const box=document.getElementById("plano-b");
  try{await navigator.clipboard.write([new ClipboardItem({"image/png":box._blob})]); toast("Imagem copiada — cole no WhatsApp ou no e-mail.");}
  catch(e){toast("Seu navegador não permitiu copiar. Use o botão direito na imagem → “Copiar imagem” ou “Salvar imagem como…”.",true);}

/* Antes de baixar, descobre se este visitante pode usar o download do Claude e por quê. */
async function motivoBloqueio(){
  if(!inArtifact()) return null;
  const perm=await useCap("permissions",4000);
  const st=perm?await perm.state("downloads").catch(()=>null):null;
  if(st==="denied") return {code:"denied",perm};
  const dl=await useCap("downloads");
  if(!dl||st==="unavailable") return {code:"unavailable"};
  return null;
}
const MOTIVO={
  denied:"Você recusou um download deste link antes, e o Claude guardou essa escolha. Clique em <b>Reativar download</b> e ligue a opção “Downloads”, ou use a imagem abaixo.",
  unavailable:"O download não está liberado para a sua conta neste link. Normalmente é porque você <b>não está logado no Claude</b> ou está com uma conta <b>fora da organização da Berry</b>. Faça login com a conta da Berry e recarregue — ou use a imagem abaixo.",
  extension_not_enabled:"Esta visualização não permite baixar PDF. Use a imagem abaixo.",
  rejected_extension:"Esta visualização não permite baixar PDF. Use a imagem abaixo.",
  not_granted:"O download não foi autorizado nesta visualização. Use a imagem abaixo.",
  capability_disabled:"O download não está disponível nesta visualização. Use a imagem abaixo.",
  capability_removed:"O download não está disponível nesta visualização. Use a imagem abaixo."
};
async function baixarPDF(){
  const btn=document.getElementById("btn-pdf"); btn.disabled=true; btn.textContent="Verificando…"; toast("");
  const fim=()=>{btn.disabled=false; btn.textContent="Baixar PDF";};
  const bloq=await motivoBloqueio();
  if(bloq){
    if(bloq.code==="denied") document.getElementById("btn-perm").hidden=false;
    fim(); await mostrarImagem(MOTIVO[bloq.code]); return;
  }
  btn.textContent="Gerando PDF…";
  const sx=window.scrollX, sy=window.scrollY; window.scrollTo(0,0); /* html2pdf sai em branco/cortado com a página rolada */
  let blob=null;
  try{
    if(!window.html2pdf) throw {message:"a biblioteca de PDF não carregou (verifique a internet e recarregue a página)"};
    try{await document.fonts.ready;}catch(e){}
    const stage=montarPalco();
    try{ blob=await comTempo(html2pdf().set(PDF_OPT()).from(stage.firstElementChild).outputPdf("blob"),45000,"tempo esgotado ao gerar o PDF"); }
    finally{stage.innerHTML="";}
  }catch(e){ window.scrollTo(sx,sy); fim(); toast("Não foi possível gerar o PDF: "+((e&&e.message)||"erro desconhecido")+".",true); return; }
  window.scrollTo(sx,sy);
  try{
    await salvarArquivo(fileBase()+".pdf",blob);
    toast(inArtifact()?"PDF salvo — confira a pasta de downloads.":"PDF baixado.");
  }catch(e){
    const c=e&&e.code;
    if(c==="declined") toast("Download cancelado na janela de confirmação. Clique em Baixar PDF de novo e confirme.",true);
    else if(c==="rate_limited") toast(ERRO_DL[c],true);
    else { fim(); await mostrarImagem(MOTIVO[c]||("O download foi recusado ("+(c||"erro")+"). Use a imagem abaixo.")); return; }
  }
  fim();
}
async function reativarDownload(){
  const perm=await useCap("permissions",4000);
  try{ await perm.manage(); const st=await perm.state("downloads"); if(st!=="denied"){document.getElementById("btn-perm").hidden=true; toast("Download reativado. Clique em Baixar PDF.");} }
  catch(e){ toast("Abra o menu do link (no topo da página) → Permissões e ligue “Downloads”.",true); }
}

/* ---------- histórico ---------- */

    <div class="drawer-b">

      ${items.length?items.map(it=>{const c=calc(it);return `<div class="hitem ${it.id===S.id?"cur":""}"><div class="grow">

        <div class="hscore" style="color:${c.mat?COL[c.mat.k]:"var(--muted)"}">${dec(c.nota)}<small>${c.mat?c.mat.t.toUpperCase():"—"}</small></div></div>`}).join("")
      :`<div class="empty">Nenhum diagnóstico salvo ainda. Clique em “+ Novo diagnóstico” para começar — tudo é salvo automaticamente.</div>`}

function hydrate(it){
  const s=Object.assign(blank(),it);
  s.numeros=Object.assign(blank().numeros,it.numeros||{});
  if(s.numeros.fat==null&&it.numeros&&it.numeros.atual!=null) s.numeros.fat=it.numeros.atual;
  s.vaz=it.vaz||{};
  return s;
}
async function listarTodos(){
  let db=[]; if(store.kind==="db"){try{db=(await store.list()).map(x=>({...x,_onde:"time"}));}catch(e){}}
  let loc=[]; try{loc=(await localStore.list()).map(x=>({...x,_onde:"local"}));}catch(e){}
  const m=new Map(); [...db,...loc].forEach(x=>{const o=m.get(x.id); if(!o||(x.atualizadoEm||"")>(o.atualizadoEm||""))m.set(x.id,x);});
  return [...m.values()];
}
async function openDiag(id){
  const items=await listarTodos(); const it=items.find(x=>x.id===id); if(!it)return; ondeSalvo=it._onde||null; delete it._onde;
  S=hydrate(it); setCurrent(S.id); step=0; openNotes.clear(); tipoAviso=false; drawerOpen=false; renderDrawer(); render(); window.scrollTo(0,0);
}
function novo(){ondeSalvo=null; S=blank(); setCurrent(S.id); step=0; openNotes.clear(); tipoAviso=false; drawerOpen=false; renderDrawer(); render(); window.scrollTo(0,0); document.getElementById("f-empresa-nome")?.focus();}

/* ---------- eventos ---------- */
document.addEventListener("click",async ev=>{
  const t=ev.target.closest("button,[data-close]"); if(!t)return;
  if(t.dataset.go!=null){step=+t.dataset.go; render(); window.scrollTo(0,0); return;}
  if(t.dataset.action==="new"||t.id==="btn-new"){novo();return;}
  if(t.id==="btn-history"){drawerOpen=true; pendingDel=null; renderDrawer(); return;}
  if(t.hasAttribute("data-close")){drawerOpen=false; renderDrawer(); return;}
  if(t.hasAttribute("data-open-example")){S=exemplo(); step=0; drawerOpen=false; renderDrawer(); render(); return;}
  if(t.dataset.open){openDiag(t.dataset.open); return;}
  if(t.dataset.del){
    if(pendingDel===t.dataset.del){await store.remove(t.dataset.del); if(S.id===t.dataset.del){S=exemplo(); step=0; render();} pendingDel=null;}
    else{pendingDel=t.dataset.del; setTimeout(()=>{if(pendingDel===t.dataset.del){pendingDel=null; renderDrawer();}},4000);}
    renderDrawer(); return;}
  if(t.dataset.canal){const a=S.empresa.canais, i=a.indexOf(t.dataset.canal); i>=0?a.splice(i,1):a.push(t.dataset.canal); t.setAttribute("aria-pressed",i<0); touch(); return;}
  if(t.dataset.tempo){S.numeros.tempo=+t.dataset.tempo; document.querySelectorAll("[data-tempo]").forEach(b=>b.setAttribute("aria-pressed",b===t)); refreshPerdas(); touch(); return;}
  if(t.dataset.tipo){const antes=S.empresa.tipo; if(antes===t.dataset.tipo)return; S.empresa.tipo=t.dataset.tipo;
    if(!SUBSEG[S.empresa.tipo].includes(S.empresa.segmento)) S.empresa.segmento="";
    tipoAviso=!!(antes&&calc(S).respondidas>0); touch(); render(); return;}
  if(t.dataset.pick){const path=t.dataset.pick, v=t.dataset.val, novoV=getPath(S,path)===v?(path.startsWith("empresa.")?"":null):v; setPath(S,path,novoV);
    document.querySelectorAll(`[data-pick="${path}"]`).forEach(b=>b.setAttribute("aria-pressed",b.dataset.val===novoV)); afterPick(); touch(); return;}
  if(t.hasAttribute("data-multi")){const path=t.dataset.multi; let a=getPath(S,path); if(!Array.isArray(a)){a=[]; setPath(S,path,a);}
    const k=a.indexOf(t.dataset.val); k>=0?a.splice(k,1):a.push(t.dataset.val); t.setAttribute("aria-pressed",k<0); afterPick(); touch(); return;}
  if(t.dataset.restipo){S.numeros.resTipo=t.dataset.restipo; touch(); render(); document.querySelector('[data-money="numeros.resultado"]')?.focus(); return;}
  if(t.dataset.vazReset){delete S.vaz[t.dataset.vazReset]; refreshPerdas(true); touch(); return;}
  if(t.dataset.prio!=null){S.dor.prioridade=+t.dataset.prio; document.querySelectorAll("[data-prio]").forEach(b=>b.setAttribute("aria-pressed",b===t)); afterPick(); touch(); return;}
  if(t.dataset.na){const r=S.respostas[t.dataset.na]||(S.respostas[t.dataset.na]={nota:""}); r.n=r.n==="na"?null:"na"; refreshQ(t.dataset.na); return;}
  if(t.dataset.clear){const r=S.respostas[t.dataset.clear]; if(r)r.n=null; refreshQ(t.dataset.clear); return;}
  if(t.id==="btn-pdf"){baixarPDF();return;}
  if(t.id==="btn-print"){imprimir();return;}
  if(t.id==="btn-png"){mostrarImagem("");return;}
  if(t.id==="btn-copy-img"){copiarImagem();return;}
  if(t.id==="btn-fechar-pb"){const b=document.getElementById("plano-b"); b.hidden=true; b.innerHTML="";return;}
  if(t.id==="btn-perm"){reativarDownload();return;}
  if(t.id==="btn-copy"){copiarResumo();return;}
});

function refreshQ(id,save=true){
  const q=qsDe(S).find(x=>x.id===id), el=document.getElementById("q-"+id);
  if(el){el.outerHTML=qHTML(q);}
  const c=calc(S);
  document.querySelectorAll(".pillar-h").forEach(h=>{const p=h.dataset.pilar; const v=scoreOf(PERGUNTAS.filter(x=>x.pilar===p),S.respostas); h.querySelector("span").textContent=v==null?"":pct(v);});
  const pr=document.querySelector(".prog"); if(pr){pr.querySelector("span").textContent=`${c.respondidas}/${PERGUNTAS.length}`; pr.querySelector("i").style.width=c.respondidas/PERGUNTAS.length*100+"%";}
  if(save)touch(); else updateChrome();
}
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.dataset.q){const r=S.respostas[t.dataset.q]||(S.respostas[t.dataset.q]={nota:""}); r.n=t.value; refreshQ(t.dataset.q);
    document.getElementById("r-"+t.dataset.q+"-"+t.value)?.focus();}
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.dataset.bind){setPath(S,t.dataset.bind,t.value); if(t.dataset.bind==="empresa.consultor"){try{localStorage.setItem("berry-consultor",t.value)}catch(e){}}
    if(t.dataset.bind.startsWith("dor."))afterPick(); touch(); return;}
  if(t.dataset.note){const r=S.respostas[t.dataset.note]||(S.respostas[t.dataset.note]={n:null}); r.nota=t.value; touch(); return;}
  if(t.dataset.money){const v=parseMoney(t.value); setPath(S,t.dataset.money,v);
    const pos=t.value.length-t.selectionStart; t.value=fmtMoneyInput(v); const np=Math.max(0,t.value.length-pos); t.setSelectionRange(np,np);
    refreshPerdas(true); touch(); return;}
  if(t.hasAttribute("data-ref")){S.numeros.margemRef=parseNum(t.value); refreshPerdas(true); touch(); return;}
  if(t.dataset.vaz){const v=parseNum(t.value); if(v==null)delete S.vaz[t.dataset.vaz]; else S.vaz[t.dataset.vaz]=Math.min(100,v); refreshPerdas(); touch(); return;}
});
document.addEventListener("focusout",ev=>{
  if(ev.target.dataset&&ev.target.dataset.vaz!=null)
    setTimeout(()=>{const l=document.getElementById("leaks"); if(l&&!l.contains(document.activeElement)) refreshPerdas(true);},150);
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&drawerOpen){drawerOpen=false; renderDrawer();}});

/* ---------- início ---------- */
(async function start(){
  render();
  const db=await useCap("db");
  if(db) store=dbStore(db);
  let cur=null; try{cur=localStorage.getItem(LS_CUR)}catch(e){}
  if(cur){try{const items=await listarTodos(); const it=items.find(x=>x.id===cur); if(it){ondeSalvo=it._onde; delete it._onde; S=hydrate(it); render();}}catch(e){}}
  /* o que foi salvo no navegador antes do banco responder sobe para o histórico do time */
  if(store.kind==="db"){try{for(const it of await localStore.list()){try{await store.save(it); await localStore.remove(it.id);}catch(e){break;}}}catch(e){}}
})();
</script>
